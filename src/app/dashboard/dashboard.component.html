<h1>Dashboard</h1>
<div class="stats">
  <mat-card appearance="outlined" class="stat"><div class="value">{{ counts.todo }}</div><div>To do</div></mat-card>
  <mat-card appearance="outlined" class="stat"><div class="value">{{ counts.inProgress }}</div><div>In progress</div></mat-card>
  <mat-card appearance="outlined" class="stat"><div class="value">{{ counts.done }}</div><div>Done</div></mat-card>
</div>

<h2>Open tasks</h2>
@if (tasks.length) {
  <div>
    @for (task of tasks; track trackById($index, task)) {
      <app-task-card [task]="task" (statusChange)="onStatusChange(task, $event)"></app-task-card>
    }
  </div>
} @else {
  <p>No open tasks. Nice work!</p>
}
<a mat-raised-button color="primary" routerLink="/tasks">All tasks</a>
